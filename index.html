<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Potion Master: Wizard Sort</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧪</text></svg>">
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=MedievalSharp&display=swap" rel="stylesheet">
  <!-- Pixi.js High-Performance WebGL Engine -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/7.3.2/pixi.min.js"></script>
</head>
<body>
  <div id="game-wrapper">
    <header id="game-header">
      <div class="header-left">
        <span class="house-badge" id="house-badge">🦁 Gryffindor</span>
      </div>
      <div class="header-center">
        <h1 id="level-title">LEVEL 1</h1>
        <p id="level-sub">Novice Alchemist (v25)</p>
      </div>
      <div class="header-right">
        <button id="btn-sound" class="icon-btn" title="Звук">🔊</button>
      </div>
    </header>

    <main id="canvas-container">
      <!-- WebGL Canvas rendered by Pixi.js -->
    </main>

    <footer id="game-footer">
      <button id="btn-restart" class="action-btn">
        <span class="btn-icon">↺</span>
        <span class="btn-text">Заново</span>
      </button>
      <button id="btn-undo" class="action-btn">
        <span class="btn-icon">⤺</span>
        <span class="btn-text">Назад</span>
      </button>
      <button id="btn-grimoire" class="action-btn grimoire-btn">
        <span class="btn-icon">📖</span>
        <span class="btn-text">Гримуар</span>
      </button>
    </footer>

    <!-- Win Modal -->
    <div id="win-modal" class="modal hidden">
      <div class="modal-content">
        <div class="win-stars">✨ 🌟 ✨</div>
        <h2 id="win-title">ЗЕЛЬЕ СВАРЕНО!</h2>
        <p id="win-desc">Вы успешно очистили магический эликсир и открыли рецепт в Гримуаре.</p>
        <div id="potion-card" class="potion-card">
          <div class="potion-preview" id="potion-preview"></div>
          <div class="potion-info">
            <span class="potion-name" id="potion-name">Эликсир Огня</span>
            <span class="potion-rarity">Редкий артефакт</span>
          </div>
        </div>
        <button id="btn-next-level" class="primary-btn">СЛЕДУЮЩИЙ УРОВЕНЬ →</button>
      </div>
    </div>
  </div>

  <script src="levels.js?v=21"></script>
  <script src="audio.js?v=21"></script>
  <script src="game.js?v=21"></script>
</body>
</html>
